<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E293B"/>
      <stop offset="100%" style="stop-color:#0F172A"/>
    </linearGradient>
    <linearGradient id="codeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#cardBg)" rx="24"/>
  
  <!-- Code editor mockup -->
  <rect x="50" y="50" width="700" height="500" fill="#0F172A" rx="16"/>
  <rect x="50" y="50" width="700" height="40" fill="#1E293B" rx="16"/>
  <circle cx="80" cy="70" r="8" fill="#EF4444"/>
  <circle cx="110" cy="70" r="8" fill="#EAB308"/>
  <circle cx="140" cy="70" r="8" fill="#22C55E"/>
  
  <!-- Code lines -->
  <g fill="#3B82F6" opacity="0.8">
    <rect x="80" y="120" width="120" height="12" rx="4"/>
    <rect x="210" y="120" width="80" height="12" rx="4" fill="#8B5CF6"/>
  </g>
  <g fill="#64748B">
    <rect x="100" y="150" width="200" height="10" rx="3"/>
    <rect x="100" y="175" width="150" height="10" rx="3"/>
    <rect x="100" y="200" width="250" height="10" rx="3"/>
  </g>
  <g fill="#3B82F6" opacity="0.6">
    <rect x="80" y="240" width="100" height="12" rx="4"/>
    <rect x="190" y="240" width="60" height="12" rx="4" fill="#22C55E"/>
  </g>
  <g fill="#64748B">
    <rect x="100" y="270" width="180" height="10" rx="3"/>
    <rect x="100" y="295" width="220" height="10" rx="3"/>
    <rect x="100" y="320" width="140" height="10" rx="3"/>
  </g>
  <g fill="#8B5CF6" opacity="0.6">
    <rect x="80" y="360" width="80" height="12" rx="4"/>
  </g>
  <g fill="#64748B">
    <rect x="100" y="390" width="260" height="10" rx="3"/>
    <rect x="100" y="415" width="190" height="10" rx="3"/>
  </g>
  
  <!-- Floating elements -->
  <g transform="translate(550, 150)">
    <rect width="180" height="120" fill="url(#codeGlow)" rx="12" opacity="0.2"/>
    <text x="90" y="45" text-anchor="middle" font-family="monospace" font-size="12" fill="#3B82F6">&lt;/&gt;</text>
    <text x="90" y="70" text-anchor="middle" font-family="system-ui" font-size="14" fill="#fff">Web Development</text>
    <text x="90" y="90" text-anchor="middle" font-family="system-ui" font-size="11" fill="#94A3B8">Modern & Responsive</text>
  </g>
  
  <g transform="translate(520, 380)">
    <rect width="200" height="100" fill="#22C55E" rx="12" opacity="0.15"/>
    <text x="100" y="40" text-anchor="middle" font-family="system-ui" font-size="14" fill="#22C55E">✓ Live Preview</text>
    <text x="100" y="65" text-anchor="middle" font-family="system-ui" font-size="11" fill="#94A3B8">Real-time updates</text>
  </g>
</svg>
